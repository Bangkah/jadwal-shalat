[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jadwal-shalat"
version = "1.1.0"
description = "CLI tool untuk menampilkan jadwal shalat otomatis berdasarkan lokasi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Muhammad Dhiyaul Atha", url = "https://github.com/Bangkah" },
]
keywords = ["shalat", "prayer", "jadwal", "islam", "cli", "aladhan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Indonesian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "geoip2",
]

[project.optional-dependencies]
tzdata = ["tzdata"]

[project.scripts]
jadwal-shalat = "jadwal_shalat.cli:main"

[project.urls]
Homepage = "https://github.com/Bangkah/jadwal-shalat"
Repository = "https://github.com/Bangkah/jadwal-shalat"
"Bug Tracker" = "https://github.com/Bangkah/jadwal-shalat/issues"

[tool.hatch.build.targets.wheel]
packages = ["jadwal_shalat"]
